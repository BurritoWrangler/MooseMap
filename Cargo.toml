[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/scanners",
    "crates/report",
    "crates/server",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["MooseMap contributors"]
repository = "https://github.com/your-org/moosemap"
rust-version = "1.80"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web / API
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# Persistence
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "macros"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Networking / parsing
ipnet = { version = "2", features = ["serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"

[profile.release]
lto = "thin"
codegen-units = 1
