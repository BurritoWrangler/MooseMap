<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MooseMap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#2d7fd0"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- Map pin -->
  <path d="M64 24
           c-18 0-32 13.5-32 31
           c0 22 32 49 32 49
           s32-27 32-49
           c0-17.5-14-31-32-31z"
        fill="url(#pin)" stroke="#9fd0ff" stroke-width="2"/>

  <!-- Moose head silhouette inside the pin's circle -->
  <g fill="#0b1120">
    <!-- antlers -->
    <path d="M48 44
             c-6-6-14-7-18-3 5 1 8 3 10 6-5-1-10 0-13 3 6 0 10 1 13 4
             c3 3 6 4 10 4z"/>
    <path d="M80 44
             c6-6 14-7 18-3-5 1-8 3-10 6 5-1 10 0 13 3-6 0-10 1-13 4
             c-3 3-6 4-10 4z"/>
    <!-- head/muzzle -->
    <path d="M64 42
             c-9 0-15 6-15 15
             c0 7 3 12 7 16
             c2 5 4 9 8 11
             c4-2 6-6 8-11
             c4-4 7-9 7-16
             c0-9-6-15-15-15z"/>
  </g>
  <!-- eyes -->
  <circle cx="58" cy="58" r="2.4" fill="#4aa8ff"/>
  <circle cx="70" cy="58" r="2.4" fill="#4aa8ff"/>
</svg>
